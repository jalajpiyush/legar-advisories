<!DOCTYPE html>
<html>
<head>
    <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
</head>
<body>
    <div id="test" style="width: 100vw; height: 100vh; background: red;"></div>
    <script>
        const mc = new Hammer(document.getElementById('test'));
        mc.get('swipe').set({ direction: Hammer.DIRECTION_ALL });
        const swipe3 = new Hammer.Swipe({ event: 'swipe3', pointers: 3, direction: Hammer.DIRECTION_HORIZONTAL });
        mc.add(swipe3);
        mc.on('swipe3right', () => console.log('back'));
    </script>
</body>
</html>
